name: CI Pipeline

on:
  pull_request:
    branches: [main, staging, develop]
  push:
    branches: [main, staging, develop]

# PR 코멘트 작성을 위한 권한 설정
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # Setup: 의존성 설치 및 빌드 (1회만)
  setup:
    name: Setup & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_WORKERS_API_URL: ${{ secrets.VITE_WORKERS_API_URL }}
          # K-FDE Studio 공개 설정. 레포 변수가 'true' 일 때만 켜진다 (없으면 꺼짐)
          VITE_FEATURE_KFDE_STUDIO: ${{ vars.VITE_FEATURE_KFDE_STUDIO }}
          # 제품 문의 양식 공개 설정과 Turnstile 사이트 키 (레포 변수)
          VITE_FEATURE_PRODUCT_INQUIRY: ${{ vars.VITE_FEATURE_PRODUCT_INQUIRY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

      - name: Check bundle size
        run: |
          echo "📦 Build artifacts:"
          du -sh dist
          echo ""
          echo "📊 Detailed breakdown:"
          du -h dist/* | sort -rh | head -20

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist
          retention-days: 7

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

  # Lint & Type Check
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      # 공개 문구 검사: 금칙어와 긴 줄표. 금칙어 목록은 저장소에 두지 않고 시크릿으로 받는다.
      # 목록이 없으면 금칙어 검사는 통과가 아니라 미측정으로 기록된다.
      - name: Check public copy (K-FDE Studio)
        run: node scripts/guards/check-public-copy.mjs
        env:
          BLOCKED_TOKENS_JSON: ${{ secrets.KFDE_BLOCKED_TOKENS_JSON }}

  # ============================================
  # Unit 테스트는 로컬 pre-commit hook에서 실행
  # CI에서는 빌드/린트/타입체크만 확인
  # ============================================

  # ============================================
  # Cloudflare Pages 배포 (Phase 1: 호스팅 마이그레이션)
  # ============================================
  # 마이그레이션 완료 후 Vercel 배포 제거 예정
  deploy-cloudflare:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [setup, lint]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=idea-on-action --branch=${{ github.ref_name }} --commit-message="${{ github.sha }}"

      - name: Comment PR with deployment URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ github.head_ref || github.ref_name }}';
            const projectName = 'idea-on-action';

            // Cloudflare Pages 프리뷰 URL 패턴
            const previewUrl = `https://${branch}.${projectName}.pages.dev`;
            const productionUrl = 'https://idea-on-action.pages.dev';

            const body = `## 🚀 Cloudflare Pages Deployment

            | Environment | URL |
            |-------------|-----|
            | Preview | [${previewUrl}](${previewUrl}) |
            | Production | [${productionUrl}](${productionUrl}) |

            **Branch:** \`${branch}\`
            **Status:** ✅ Deployed

            > 📝 Note: DNS 마이그레이션 완료 후 www.ideaonaction.ai로 접근 가능
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
